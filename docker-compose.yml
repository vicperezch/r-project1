services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: airline
      POSTGRES_PASSWORD: airline
      POSTGRES_DB: airline
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Postgres runs these once, on the first boot of an empty volume.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airline -d airline"]
      interval: 3s
      timeout: 3s
      retries: 20

  airline-mcp:
    build:
      context: .
      dockerfile: deploy/Dockerfile.airline
    environment:
      DATABASE_URL: postgres://airline:airline@postgres:5432/airline
    command: ["-transport", "http", "-addr", ":8080"]
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # busybox wget, already present in alpine.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  chatbot:
    build:
      context: .
      dockerfile: deploy/Dockerfile.chatbot
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in your environment or .env}
      CHATBOT_MODEL: ${CHATBOT_MODEL:-claude-haiku-4-5}
    volumes:
      - ./logs:/app/logs
      - ./workspace:/workspace
    depends_on:
      airline-mcp:
        condition: service_healthy
    # The chatbot is an interactive REPL, so it is started with
    # docker compose run, not docker compose up.
    stdin_open: true
    tty: true

volumes:
  pgdata:
